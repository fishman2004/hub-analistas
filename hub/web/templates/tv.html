<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub dos Analistas · TV</title>
  <link rel="icon" href="/static/hub.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/tv.css?v={{ version }}">
</head>
<body>
  <header class="topo">
    <div class="marca"><img src="/static/hub.svg" alt="" width="44" height="44"> Hub dos Analistas</div>
    <div id="rotacao" class="rotacao" aria-hidden="true"></div>
    <div class="topo-dir">
      <div id="atrasadas" class="aviso-atraso" hidden></div>
      <div class="relogio"><span id="data"></span><strong id="hora"></strong></div>
    </div>
  </header>
  <div id="sem-conexao" class="sem-conexao" hidden></div>
  <section id="presenca" class="presenca" aria-label="Presença da equipe"></section>
  <main id="telas" class="telas">
    <section class="tela ativa" data-tela="quadro" aria-label="Quadro">
      <div class="quadro">
        <section class="coluna" data-col="todo"><h2>A fazer <span class="contagem"></span><span class="pagina"></span></h2><div class="cartoes"></div></section>
        <section class="coluna" data-col="doing"><h2>Fazendo <span class="contagem"></span><span class="pagina"></span></h2><div class="cartoes"></div></section>
        <section class="coluna" data-col="done"><h2>Concluído hoje <span class="contagem"></span><span class="pagina"></span></h2><div class="cartoes"></div></section>
      </div>
    </section>
    <section class="tela" data-tela="prazos" aria-label="Prazos da semana">
      <h1 class="tela-titulo">Prazos da semana</h1>
      <div class="prazos"></div>
    </section>
    <section class="tela painel" data-tela="metas-mes" aria-label="Metas do mês">
      <header class="painel-topo"></header>
      <div class="bloco evolucao"><h2>Evolução do financeiro · total do mês</h2><div class="grafico"></div></div>
      <div class="bloco"><h2>Financeiro</h2><div class="cartoes-pasta" data-serie="financeiro"></div></div>
      <div class="bloco"><h2>Positivações</h2><div class="cartoes-pasta" data-serie="positivacao"></div></div>
    </section>
    <section class="tela painel" data-tela="metas-dia" aria-label="Metas do dia">
      <header class="painel-topo"></header>
      <div class="dia-lados">
        <div class="bloco"><h2>Financeiro do dia</h2><div class="barras-pasta" data-serie="financeiro"></div></div>
        <div class="bloco"><h2>Positivações do dia</h2><div class="barras-pasta" data-serie="positivacao"></div></div>
      </div>
    </section>
    <section class="tela painel" data-tela="produtos-foco" aria-label="Produtos foco">
      <header class="painel-topo"></header>
      <div class="bloco focos-bloco"><h2>Clientes positivados em % da meta <span class="pagina"></span></h2><div class="focos"></div></div>
    </section>
  </main>
  <script src="/static/tv.js?v={{ version }}"></script>
  <script src="/static/tv-telas/quadro.js?v={{ version }}"></script>
  <script src="/static/tv-telas/prazos.js?v={{ version }}"></script>
  <script src="/static/tv-paineis.js?v={{ version }}"></script>
  <script src="/static/tv-telas/metas-mes.js?v={{ version }}"></script>
  <script src="/static/tv-telas/metas-dia.js?v={{ version }}"></script>
  <script src="/static/tv-telas/produtos-foco.js?v={{ version }}"></script>
</body>
</html>
